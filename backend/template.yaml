AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Face Recognition API for mobile app uploads

Parameters:
  CollectionName:
    Type: String
    Default: recoEstu
    Description: Rekognition collection ID
  AuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secreto HMAC para firmar los JWT. Obligatorio y distinto de AdminToken (python -c "import secrets; print(secrets.token_urlsafe(48))").
  AdminToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Token para /register-teacher (header x-admin-token). Vacío desactiva ese endpoint.
  DDBTableName:
    Type: String
    Default: face_recognition
    Description: DynamoDB table with RekognitionId (PK) and FullName (S)
  FaceMatchThreshold:
    Type: Number
    Default: 85
    Description: Similitud mínima (0-100) para aceptar una coincidencia facial en la foto de grupo.
  MaxMatches:
    Type: Number
    Default: 5
  PillowLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-2:906847091276:layer:umb-pillow-py312:1
    Description: Capa con Pillow para Python 3.12 (Linux). La Lambda la necesita para recortar cada rostro de la foto de grupo; al venir en una capa funciona igual si se despliega con este template o con el del build.
  SesFromEmail:
    Type: String
    Default: ""
    Description: Correo verificado en Amazon SES para avisos (cuentas creadas por el administrador). Vacío desactiva el envío.

Globals:
  Function:
    Timeout: 20
    MemorySize: 512
    Runtime: python3.12
  Api:
    Auth:
      DefaultAuthorizer: NONE
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
      AllowOrigin: "'*'"

Resources:
  JustificationBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-justifications
            Status: Enabled
            ExpirationInDays: 365

  FaceApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lambda_handler.lambda_handler
      Description: Recognize faces from uploaded image
      Layers:
        - !Ref PillowLayerArn
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          COLLECTION: !Ref CollectionName
          DDB_TABLE: !Ref DDBTableName
          FACE_MATCH_THRESHOLD: !Ref FaceMatchThreshold
          MAX_MATCHES: !Ref MaxMatches
          ADMIN_TOKEN: !Ref AdminToken
          AUTH_SECRET: !Ref AuthSecret
          SES_FROM_EMAIL: !Ref SesFromEmail
          JUSTIFICATION_BUCKET: !Ref JustificationBucket
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectFaces
                - rekognition:IndexFaces
                - rekognition:SearchFacesByImage
                - rekognition:DeleteFaces
              Resource: "*"
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub ${JustificationBucket.Arn}/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
              Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DDBTableName}
      Events:
        ApiRootAny:
          Type: Api
          Properties:
            Path: /
            Method: any

        ApiProxyAny:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: any

Outputs:
  ApiUrl:
    Description: POST URL for face recognition
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/recognize
